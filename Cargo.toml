[package]
name = "cmd-share"
version = "0.3.0"
edition = "2021"
description = "局域网文件互传：电脑跑起来，手机扫码即用（浏览器零安装）"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
arboard = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
if-addrs = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
